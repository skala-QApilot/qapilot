# QApilot 설정 파일

project:
  name: "my-project"
  target_url: "http://localhost:3000"

llm:
  default_model: "gpt-4o-mini"
  deep_model: "gpt-4o"
  monthly_budget_usd: 500
  max_tokens_per_task: 200000

agent:
  timeout_sec: 60
  max_retry: 3

test:
  page_load_timeout_sec: 30
  step_timeout_sec: 30
  headless: true
  screenshot:
    success_format: "jpeg"
    success_quality: 80
    fail_format: "png"

db:
  enabled: false
  # connection_url: "postgresql://..."

dashboard:
  port: 7860

cache:
  ttl_hours: 24
