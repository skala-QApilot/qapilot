# QApilot 설정 파일

project:
  name: "my-project"
  target_url: "http://localhost:3000"
  # 격차 12 SaaS 후속 (2026-06-02) — Spring 측 body 채움 PR 머지 전까지 dev 검증용.
  # mini-bss-lite/backend/app/seed.py 의 첫 customer (demo1@minibss.test / Passw0rd!).
  # SaaS 흐름이 body 에 test_account 채워 보내면 state.test_account 가 우선 — 본 cfg 는 fallback.
  test_account:
    email: demo1@minibss.test
    password: Passw0rd!

llm:
  default_model: "gpt-4o-mini"
  deep_model: "gpt-4o"
  monthly_budget_usd: 500
  max_tokens_per_task: 400000

agent:
  timeout_sec: 60
  max_retry: 3
  overrides:
    # UI 시나리오 실행은 여러 step(각 networkidle 대기 최대 15s 포함)을 누적 실행하므로
    # 글로벌 기본값(60s)으로는 부족해 tool_timeout(TOOL_001)이 자주 발생한다.
    uitest_tool:
      timeout_sec: 120

test:
  page_load_timeout_sec: 30
  step_timeout_sec: 30
  headless: true
  screenshot:
    success_format: "jpeg"
    success_quality: 80
    fail_format: "png"

db:
  enabled: false
  # connection_url: "postgresql://..."

dashboard:
  port: 7860

cache:
  ttl_hours: 24
